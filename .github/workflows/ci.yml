name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a PR makes the previous run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library (Node + browser tiers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth: the same file `nvm use` reads.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Node tier)
        run: npm test

      # The browser tier drives real Chromium, so the binary has to exist
      # before Vitest starts. --with-deps pulls the system libraries the
      # GitHub runner image does not ship.
      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Browser tests
        run: npm run test:browser

      - name: Build
        run: npm run build

  demo:
    name: FAQ search demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck -w faq-search

      - name: Tests
        run: npm test -w faq-search

      - name: Build
        run: npm run build -w faq-search
